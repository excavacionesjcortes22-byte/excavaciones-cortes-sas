<!-- Cargar librería de Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// 1. Configuración de Supabase
const SUPABASE_URL = "https://xxtuyymnwgkqdwcqqkeg.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4dHV5eW1ud2drcWR3Y3Fxa2VnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5ODM5MjYsImV4cCI6MjEwOTU1OTkyNn0.4DkEf2wJbtKJRA80oXK1dBVgEjSDNomhOkL_gZE-QHA";

const cliente = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const pantalla = document.getElementById("login-screen");
const mensaje = document.getElementById("login-error");
const loginForm = document.getElementById("login-form");

// 2. Función para mostrar secciones
function showPage(id, button) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const targetPage = document.getElementById(id);
  if (targetPage) targetPage.classList.add('active');

  document.querySelectorAll('.menu button').forEach(b => b.classList.remove('active'));
  if (button) button.classList.add('active');

  const titles = {
    inicio: 'Panel principal',
    volquetas: 'Gestión de volquetas',
    combustible: 'Control de combustible',
    maquinaria: 'Maquinaria amarilla',
    mantenimiento: 'Mantenimiento',
    trabajadores: 'Trabajadores',
    proyectos: 'Obras y proyectos',
    informes: 'Informes empresariales'
  };
  document.getElementById('pageTitle').textContent = titles[id] || 'Panel principal';
}

// 3. Cargar volquetas desde Supabase
async function cargarVolquetas() {
  const filas = document.getElementById("truckRows");
  if (!filas) return;

  filas.innerHTML = '<tr><td colspan="4">Cargando datos de la flota...</td></tr>';

  try {
    const { data, error } = await cliente
      .from("volquetas")
      .select("codigo, placa, marca, estado")
      .order("codigo");

    if (error) throw error;

    filas.innerHTML = "";

    if (!data || data.length === 0) {
      filas.innerHTML = '<tr><td colspan="4">No hay volquetas registradas aún en la base de datos.</td></tr>';
      return;
    }

    data.forEach(v => {
      const fila = document.createElement("tr");

      const badgeState = `<span class="status">${v.estado || 'Sin estado'}</span>`;

      fila.innerHTML = `
        <td><b>${v.codigo || '-'}</b></td>
        <td>${v.placa || '-'}</td>
        <td>${v.marca || '-'}</td>
        <td>${badgeState}</td>
      `;
      filas.appendChild(fila);
    });
  } catch (err) {
    console.error("Error Supabase:", err);
    filas.innerHTML = `<tr><td colspan="4" style="color:red;">Error al cargar volquetas: ${err.message}</td></tr>`;
  }
}

// 4. Iniciar sesión
loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  mensaje.style.color = "#ed9b25";
  mensaje.textContent = "Verificando acceso...";

  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;

  try {
    const { data, error } = await cliente.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      mensaje.style.color = "#b00020";
      mensaje.textContent = "Error de acceso: " + error.message;
    } else {
      mensaje.textContent = "";
      pantalla.style.display = "none";
      await cargarVolquetas();
    }
  } catch (err) {
    mensaje.style.color = "#b00020";
    mensaje.textContent = "Error inesperado de conexión.";
  }
});

// 5. Verificar sesión activa al entrar
async function revisarSesion() {
  try {
    const { data, error } = await cliente.auth.getSession();
    if (!error && data?.session) {
      pantalla.style.display = "none";
      await cargarVolquetas();
    } else {
      pantalla.style.display = "flex";
    }
  } catch (err) {
    pantalla.style.display = "flex";
  }
}

// Ejecutar verificación inicial
revisarSesion();
</script>
